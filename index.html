<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="container">
        <h1>Expanse Tracker</h1>
        <!-- adding expanse section -->
        <div class="expanse-form">
           <input type="text" id="expanseName" placeholder="Expanse name">
           <input type="number" id="expanseAmount" placeholder="Amount">
           <input type="date" id="expenseDate" placeholder="date">

           <select name="category" id="expenseCategory">
             <option value="select category">Select Category</option>
             <option value="food"> Food</option>
             <option value="travel">Travel</option>
             <option value="shoping">Shoping</option>
             <option value="bills">Bills</option>
             <option value="entertainment">Entertainment</option>
             <option value="health">Health</option>
             <option value="other">Other</option>
           </select>

           <button id="addBtn">Add Expanse</button>
        </div>

        <div class="search-box">
              <input type="search" id="searchInput" placeholder="search expenses...">
        </div>

        <div class="filter-box">
          <select  id="filterCategory">
            <option value="All">All Categories</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shoping">Shoping</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Health">Health</option>
            <option value="Other">Other</option>
          </select>
        </div>
        
        <!-- message -->
         <p id="message"></p>

         <!-- expanse list -->
          <div>
            <h2>Expanses</h2>
            <ul id="expenseList"></ul>
          </div>

          <!-- total expanse -->
           <div class="total-box">
            <h2>Total Expanse</h2>
            <p id="total">0</p>
           </div>
     </div>

     
    <script src="script.js"></script>
</body>
</html>
